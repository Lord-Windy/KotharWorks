<!--
  Ironwood Wilds — /play page mockup (vector replica of web-mockup/play-page.html).
  Rasterized to play-page.png with rsvg-convert. Same content and palette as
  the interactive HTML version. Dark theme, terminal aesthetic.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="948" viewBox="0 0 1440 948">
  <g font-family="DejaVu Sans Mono, monospace" fill="#c9d1d9">

    <!-- page background -->
    <rect x="0" y="0" width="1440" height="948" fill="#0f1215"/>

    <!-- ══ header ══════════════════════════════════════ -->
    <rect x="0" y="0" width="1440" height="48" fill="#10151a"/>
    <line x1="0" y1="48" x2="1440" y2="48" stroke="#2a333b"/>
    <text x="20" y="30" font-size="16" font-weight="bold" fill="#9ecf8a" letter-spacing="3">IRONWOOD WILDS</text>
    <text x="220" y="30" font-size="12.5" fill="#8b98a5">Season 3 · Day 12 · tick 1,048,213</text>
    <text x="1420" y="30" font-size="12.5" text-anchor="end"><tspan fill="#8b98a5">fog 4 regions · </tspan><tspan fill="#d9a441" font-weight="bold">257</tspan><tspan fill="#8b98a5"> favor · Ashford ▾</tspan></text>

    <!-- ══ tab row ═════════════════════════════════════ -->
    <rect x="0" y="48" width="1440" height="48" fill="#0d1117"/>
    <line x1="0" y1="96" x2="1440" y2="96" stroke="#2a333b"/>

    <!-- Mara (active) -->
    <rect x="16" y="58" width="224" height="32" rx="6" fill="#1d262e" stroke="#2f4a3a"/>
    <rect x="17" y="59" width="222" height="3" fill="#7fb069"/>
    <circle cx="34" cy="74" r="4" fill="#7fb069"/>
    <text x="46" y="78" font-size="12.5">Mara</text>
    <text x="94" y="78" font-size="12.5" fill="#8b98a5">mining · 41s</text>
    <!-- Pell -->
    <rect x="248" y="58" width="208" height="32" rx="6" fill="#141a20" stroke="#232b33"/>
    <circle cx="266" cy="74" r="4" fill="#6ea8c7"/>
    <text x="278" y="78" font-size="12.5">Pell</text>
