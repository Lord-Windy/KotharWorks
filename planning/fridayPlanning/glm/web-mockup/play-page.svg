    <rect x="1116" y="58" width="118" height="32" rx="6" fill="none" stroke="#232b33"/>
    <text x="1175" y="78" font-size="12.5" fill="#8b98a5" text-anchor="middle">Expeditions</text>
    <rect x="1242" y="58" width="64" height="32" rx="6" fill="none" stroke="#232b33"/>
    <text x="1274" y="78" font-size="12.5" fill="#8b98a5" text-anchor="middle">Atlas</text>
    <rect x="1314" y="58" width="86" height="32" rx="6" fill="none" stroke="#232b33"/>
    <text x="1357" y="78" font-size="12.5" fill="#8b98a5" text-anchor="middle">Settings</text>

    <!-- ══ left panel: character ═══════════════════════ -->
    <rect x="16" y="108" width="780" height="760" rx="8" fill="#161b20" stroke="#2a333b"/>
    <text x="36" y="132" font-size="14" font-weight="bold" letter-spacing="1">MARA</text>
    <text x="94" y="132" font-size="12" fill="#8b98a5">chr:17:3 · Ashford household · reg:0:0 Harrow Ford</text>
    <text x="776" y="132" font-size="12" fill="#7fb069" text-anchor="end">Mining 12 · 34% to 13</text>
    <line x1="16" y1="142" x2="796" y2="142" stroke="#232b33"/>

    <!-- location prose -->
    <text x="36" y="168" font-size="13.5" fill="#9ecf8a">A hematite outcropping on the cold side of Harrow Ford</text>
    <text x="36" y="188" font-size="12.5" fill="#8b98a5">Scree runs down to grey water; the far bank is lost in fen mist. The rock's</text>
    <text x="36" y="205" font-size="12.5" fill="#8b98a5">rust-streaked face has been freshly worked — your picks, this morning.</text>
    <text x="52" y="228" font-size="12.5" fill="#6ea8c7">› examine: beneath the lichen, older tool marks. Someone stood here</text>
    <text x="52" y="245" font-size="12.5" fill="#5d84a0">long before the Crossing.</text>

    <!-- running action -->
    <rect x="36" y="262" width="740" height="72" rx="6" fill="#101915" stroke="#2f4a3a"/>
    <text x="52" y="283" font-size="10.5" fill="#7fb069" letter-spacing="2">RUNNING</text>
    <text x="52" y="303" font-size="12.5">mine hematite ×2 <tspan fill="#8b98a5">— site:reg:0:0:88 · Mining 12 speed</tspan></text>
    <rect x="52" y="312" width="500" height="13" rx="6.5" fill="#1a2420"/>
    <rect x="52" y="312" width="315" height="13" rx="6.5" fill="#7fb069"/>
    <text x="566" y="323" font-size="11" fill="#8b98a5">41s · est. done t+1,048,283</text>

    <!-- pending -->
    <text x="36" y="362" font-size="10.5" fill="#5c6873" letter-spacing="2">PENDING (2 OF 4)</text>
    <text x="36" y="384" font-size="12.5"><tspan fill="#5c6873">1 ·</tspan> chop timber — old hemlock stand · site:reg:0:-1:14</text>
    <rect x="756" y="370" width="20" height="20" rx="4" fill="#161b20" stroke="#2a333b"/>
    <text x="766" y="385" font-size="11" fill="#5c6873" text-anchor="middle">×</text>
    <text x="36" y="408" font-size="12.5"><tspan fill="#5c6873">2 ·</tspan> rest until dawn</text>
    <rect x="756" y="394" width="20" height="20" rx="4" fill="#161b20" stroke="#2a333b"/>
    <text x="766" y="409" font-size="11" fill="#5c6873" text-anchor="middle">×</text>
    <line x1="36" y1="422" x2="776" y2="422" stroke="#232b33" stroke-dasharray="3,4"/>

    <!-- needs -->
    <text x="36" y="446" font-size="10.5" fill="#5c6873" letter-spacing="2">NEEDS</text>
    <text x="100" y="446" font-size="11.5" fill="#8b98a5">satiety</text>
    <rect x="162" y="437" width="110" height="9" rx="4.5" fill="#1a2420"/>
    <rect x="162" y="437" width="81" height="9" rx="4.5" fill="#6ea8c7"/>
    <text x="282" y="446" font-size="11.5" fill="#8b98a5">74</text>
    <text x="330" y="446" font-size="11.5" fill="#8b98a5">energy</text>
    <rect x="392" y="437" width="110" height="9" rx="4.5" fill="#1a2420"/>
    <rect x="392" y="437" width="64" height="9" rx="4.5" fill="#d9a441"/>
    <text x="512" y="446" font-size="11.5" fill="#8b98a5">58</text>
    <text x="560" y="446" font-size="11.5" fill="#8b98a5">morale</text>
    <rect x="622" y="437" width="110" height="9" rx="4.5" fill="#1a2420"/>
    <rect x="622" y="437" width="89" height="9" rx="4.5" fill="#7fb069"/>
    <text x="742" y="446" font-size="11.5" fill="#8b98a5">81</text>

    <!-- carry / skills -->
    <text x="36" y="474" font-size="10.5" fill="#5c6873" letter-spacing="2">CARRY</text>
    <text x="100" y="474" font-size="12" fill="#8b98a5">3 iron ore · 2 hemlock sap · worn pickaxe (23% wear)</text>
    <text x="36" y="500" font-size="10.5" fill="#5c6873" letter-spacing="2">SKILLS</text>
    <text x="100" y="500" font-size="12" fill="#8b98a5">Mining 12 (34% to 13) · Woodcutting 9 · Foraging 8 · Arms 6</text>

    <!-- queue editor -->
    <line x1="36" y1="516" x2="776" y2="516" stroke="#232b33"/>
    <text x="36" y="538" font-size="10.5" fill="#5c6873" letter-spacing="2">QUEUE EDITOR</text>
    <g font-size="12" fill="#a8c0d0" text-anchor="middle">
      <rect x="36" y="548" width="92" height="28" rx="6" fill="#1d262e" stroke="#3a4a56"/><text x="82" y="566">+ travel</text>
      <rect x="136" y="548" width="96" height="28" rx="6" fill="#1d262e" stroke="#3a4a56"/><text x="184" y="566">+ gather</text>
      <rect x="240" y="548" width="86" height="28" rx="6" fill="#1d262e" stroke="#3a4a56"/><text x="283" y="566">+ craft</text>
      <rect x="334" y="548" width="88" height="28" rx="6" fill="#1d262e" stroke="#3a4a56"/><text x="378" y="566">+ build</text>
      <rect x="430" y="548" width="80" height="28" rx="6" fill="#1d262e" stroke="#3a4a56"/><text x="470" y="566">+ rest</text>
      <rect x="36" y="584" width="168" height="28" rx="6" fill="#241f14" stroke="#5a4a2a"/><text x="120" y="602" fill="#d0b88a">Replace pending…</text>
      <rect x="212" y="584" width="110" height="28" rx="6" fill="#241f14" stroke="#5a4a2a"/><text x="267" y="602" fill="#d0b88a">Cancel all</text>
    </g>

    <!-- journal -->
    <line x1="36" y1="630" x2="776" y2="630" stroke="#232b33"/>
    <text x="36" y="652" font-size="10.5" fill="#5c6873" letter-spacing="2">JOURNAL — MARA (GENERATED FROM WORLD EVENTS)</text>
    <g font-size="12.5" fill="#8b98a5">
      <text x="36" y="676"><tspan fill="#5c6873">day 12 —</tspan> worked the hematite face until my arms sang. the ore is good.</text>
      <text x="36" y="694"><tspan fill="#5c6873">day 12 —</tspan> the fen mist never lifted. Jory swears he heard drums across the water.</text>
      <text x="36" y="712"><tspan fill="#5c6873">day 11 —</tspan> shipped thirty timber out. the beacon burned all night.</text>
      <text x="36" y="730"><tspan fill="#5c6873">day 10 —</tspan> Pell's vein ran thin. he took it personally.</text>
      <text x="36" y="748"><tspan fill="#5c6873">day 9  —</tspan> crossed Harrow Ford at dawn. the far scree is rotten with ore.</text>
      <text x="36" y="766"><tspan fill="#5c6873">day 8  —</tspan> the Crossing. grey water, grey sky, and a world that has never heard of us.</text>
    </g>

    <!-- ══ right column ════════════════════════════════ -->
    <!-- while you were away -->
    <rect x="812" y="108" width="612" height="128" rx="8" fill="#151d16" stroke="#3a4a30"/>
    <text x="830" y="132" font-size="11.5" fill="#d9a441" letter-spacing="1">WHILE YOU WERE AWAY — 9 EVENTS · 34 MIN</text>
    <g font-size="12" fill="#8b98a5">
      <text x="830" y="154"><tspan fill="#5c6873">▸</tspan>  Mara finished chop ×4 — +48 wood carried home</text>
      <text x="830" y="172"><tspan fill="#5c6873">▸</tspan>  mine #2 depleted — Pell stands idle at the scree</text>
      <text x="830" y="190"><tspan fill="#5c6873">▸</tspan>  Ashford shipped 30 timber · <tspan fill="#d9a441">+45 favor</tspan></text>
    </g>
    <text x="830" y="216" font-size="11.5" fill="#6ea8c7">show all 9 ▸</text>

