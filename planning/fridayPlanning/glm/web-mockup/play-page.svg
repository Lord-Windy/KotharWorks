    <circle cx="482" cy="74" r="4" fill="#56616b"/>
    <text x="494" y="78" font-size="12.5">Jory</text>
    <text x="532" y="78" font-size="12.5" fill="#8b98a5">idle</text>
    <!-- + -->
    <rect x="640" y="58" width="34" height="32" rx="6" fill="none" stroke="#232b33"/>
    <text x="657" y="78" font-size="13" fill="#8b98a5" text-anchor="middle">+</text>
