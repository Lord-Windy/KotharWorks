      <g fill="#1c2b22" stroke="#3a5a44">
        <rect x="860" y="752" width="26" height="26" rx="4"/><rect x="890" y="752" width="26" height="26" rx="4"/><rect x="860" y="782" width="26" height="26" rx="4"/>
