    <text x="946" y="272" font-size="11.5" fill="#7fb069">● live</text>
    <line x1="830" y1="284" x2="1406" y2="284" stroke="#232b33"/>
    <g font-size="12">
      <text x="830" y="308" font-size="11" fill="#5c6873">t+1,048,170</text><text x="926" y="308" font-size="10.5" fill="#d9a441" letter-spacing="1">RUMOR</text><text x="1022" y="308" fill="#8b98a5">smoke seen past the ridge — two nights out</text>
      <text x="830" y="334" font-size="11" fill="#5c6873">t+1,047,012</text><text x="926" y="334" font-size="10.5" fill="#7fb069" letter-spacing="1">SHIPMENT</text><text x="1022" y="334" fill="#8b98a5">Ashford shipped 30 timber; the Homeland</text>
      <text x="1022" y="351" fill="#8b98a5">breathes. (+45 favor)</text>
      <text x="830" y="377" font-size="11" fill="#5c6873">t+1,046,295</text><text x="926" y="377" font-size="10.5" fill="#a08cc0" letter-spacing="1">WORLD</text><text x="1022" y="377" fill="#8b98a5">an ironwood grove was sighted in the far fens</text>
      <text x="1022" y="394" fill="#8b98a5">(unverified)</text>
      <text x="830" y="420" font-size="11" fill="#5c6873">t+1,045,940</text><text x="926" y="420" font-size="10.5" fill="#6ea8c7" letter-spacing="1">HOUSEHOLD</text><text x="1022" y="420" fill="#8b98a5">mine #2 depleted — Pell stands idle at the scree</text>
      <text x="830" y="446" font-size="11" fill="#5c6873">t+1,045,700</text><text x="926" y="446" font-size="10.5" fill="#9ecf8a" letter-spacing="1">LEVEL</text><text x="1022" y="446" fill="#8b98a5">Mara reached Woodcutting 9</text>
      <text x="830" y="472" font-size="11" fill="#5c6873">t+1,045,213</text><text x="926" y="472" font-size="10.5" fill="#c96a5a" letter-spacing="1">COMBAT</text><text x="1022" y="472" fill="#8b98a5">Jory drove off a gnarling scout at the palisade</text>
      <text x="830" y="498" font-size="11" fill="#5c6873">t+1,044,880</text><text x="926" y="498" font-size="10.5" fill="#a08cc0" letter-spacing="1">WORLD</text><text x="1022" y="498" fill="#8b98a5">rain crossed the fen country; the fords run high</text>
    </g>
    <text x="830" y="530" font-size="11.5" fill="#5c6873">older ▸</text>
    <line x1="830" y1="548" x2="1406" y2="548" stroke="#232b33"/>
    <text x="830" y="566" font-size="10.5" fill="#3f4a54">public wire: GET /v1/public/chronicle?since=cursor · spectate, no auth</text>

