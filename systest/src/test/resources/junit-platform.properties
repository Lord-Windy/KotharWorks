# Live suite ordering: classes with @Order run first (smoke, then the human first-session
# flow while Alice is still unseated on a fresh stack), the crash phase last; the rest in
# JUnit's default deterministic order. Tests must still pass in any order on a kept stack.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
junit.jupiter.execution.timeout.default=5m
